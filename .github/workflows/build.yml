
name: Build Demo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check repository and extract ZIP
        run: |
          echo "Repository files:"
          ls -lah
          echo "Extracting project..."
          mkdir -p source
          unzip -o Hamari_Chit_Fund_Demo_Source_v2.zip -d source
          echo "Project files:"
          find source -name settings.gradle.kts

      - name: Build Android APK
        run: |
          PROJECT_FILE=$(find source -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Upload Demo APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamari-Chit-Fund-Demo-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
